# Edge: mineloader.grudge-studio.com → Mine-Loader SPA (Vercel)
#
# Canonical **play / multiplayer / map-deploy** host for voxel Realms.
# Harvest mode + DRC combat use the same SPA with query/hash modes.
#
# Deploy (Cloudflare account with grudge-studio.com zone):
#   cd infra/cloudflare/mineloader && npx wrangler deploy
#
# Origin override (optional):
#   npx wrangler secret put ORIGIN_HOST
#   # enter: mine-loader.vercel.app
#
# Related alias: mine.grudge-studio.com (Mine-Loader repo infra/cloudflare/mine)

name = "mineloader-edge-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"
account_id = "ee475864561b02d4588180b8b9acf694"

[[routes]]
pattern = "mineloader.grudge-studio.com"
custom_domain = true
